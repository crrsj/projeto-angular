<div class="max-w-4xl mx-auto p-6 bg-white shadow-md rounded-lg mt-6">
  <h2 class="text-2xl font-bold mb-6 text-gray-800">Cadastrar Novo Cliente</h2>

  <!-- Mensagem de Erro Geral -->
  <div *ngIf="mensagemErro" class="mb-4 p-4 bg-red-100 border-l-4 border-red-500 text-red-700 rounded">
    <p class="font-bold">Atenção</p>
    <p>{{ mensagemErro }}</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="salvar()" class="space-y-6">

    <!-- DADOS PESSOAIS -->
    <div>
      <h3 class="text-lg font-semibold text-gray-700 mb-3 border-b pb-2">Dados Pessoais</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Nome Completo *</label>
          <input type="text" formControlName="nome" placeholder="Digite o nome"
            class="mt-1 block w-full rounded-md border-gray-300 border p-2 shadow-sm focus:border-blue-500 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">E-mail *</label>
          <input type="email" formControlName="email" placeholder="exemplo@email.com"
            class="mt-1 block w-full rounded-md border-gray-300 border p-2 shadow-sm focus:border-blue-500 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">CPF / CNPJ *</label>
          <input type="text" formControlName="cpfOuCnpj" placeholder="Digite o documento"
            class="mt-1 block w-full rounded-md border-gray-300 border p-2 shadow-sm focus:border-blue-500 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Telefone *</label>
          <input type="text" formControlName="telefone" placeholder="(00) 00000-0000"
            class="mt-1 block w-full rounded-md border-gray-300 border p-2 shadow-sm focus:border-blue-500 focus:ring-blue-500">
        </div>
      </div>
    </div>

    <!-- SUB-GRUPO ENDEREÇO -->
    <div formGroupName="endereco">
      <h3 class="text-lg font-semibold text-gray-700 mb-3 border-b pb-2">Endereço</h3>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">CEP *</label>
          <input type="text" formControlName="cep" (blur)="buscarCep()" placeholder="00000000" maxlength="8"
            class="mt-1 block w-full rounded-md border-gray-300 border p-2 shadow-sm focus:border-blue-500 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Número *</label>
          <input type="text" formControlName="numero" placeholder="123"
            class="mt-1 block w-full rounded-md border-gray-300 border p-2 shadow-sm focus:border-blue-500 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Complemento</label>
          <input type="text" formControlName="complemento" placeholder="Apto, Bloco, etc."
            class="mt-1 block w-full rounded-md border-gray-300 border p-2 shadow-sm focus:border-blue-500 focus:ring-blue-500">
        </div>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700">Logradouro *</label>
        <input type="text" formControlName="logradouro" readonly
          class="mt-1 block w-full rounded-md border-gray-300 border p-2 bg-gray-100 text-gray-600 shadow-sm">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Bairro *</label>
          <input type="text" formControlName="bairro" readonly
            class="mt-1 block w-full rounded-md border-gray-300 border p-2 bg-gray-100 text-gray-600 shadow-sm">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Cidade *</label>
          <input type="text" formControlName="cidade" readonly
            class="mt-1 block w-full rounded-md border-gray-300 border p-2 bg-gray-100 text-gray-600 shadow-sm">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Estado *</label>
          <input type="text" formControlName="estado" readonly
            class="mt-1 block w-full rounded-md border-gray-300 border p-2 bg-gray-100 text-gray-600 shadow-sm">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">UF *</label>
          <input type="text" formControlName="uf" readonly maxlength="2"
            class="mt-1 block w-full rounded-md border-gray-300 border p-2 bg-gray-100 text-gray-600 shadow-sm">
        </div>
      </div>
    </div>

    <!-- BOTOES DE ACAO -->
    <div class="flex justify-end space-x-3 pt-6 border-t">
      <a routerLink="/dashboard"
        class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none">
        Cancelar
      </a>
      <button type="submit"
        class="px-4 py-2 bg-blue-600 text-white rounded-md text-sm font-medium hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
        Salvar Cliente
      </button>
    </div>

  </form>
</div>
